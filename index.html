    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- Loaded by app.js after the first card is on screen, in this order: the
         kana modules need none of it, and these files are most of the download.
         A visitor who last studied a vocab or grammar deck starts downloading them
         at once (preload), alongside the app; this sits before the stylesheet so
         the hint script does not wait for it. -->
    <template id="studyDataScripts">
      <script src="./audio-manifest.js"></script>
      <script src="./n5-codex-vocab.js"></script>
      <script src="./ayaya-n4-codex-vocab.js"></script>
      <script src="./ayaya-n3-codex-vocab.js"></script>
      <script src="./ayaya-n2-codex-vocab.js"></script>
      <script src="./grammar-data.js"></script>
      <script src="./pitch-accent-data.js"></script>
      <script src="./homophone-data.js"></script>
      <script src="./romaji-word-spacing.js"></script>
      <script src="./example-readings.js"></script>
      <script src="./card-data.js"></script>
    </template>
    <script>
      (() => {
        try {
          if (localStorage.getItem("ayaya-jp-start-family-v1") !== "study") return;
          const template = document.querySelector("#studyDataScripts");
          template?.content.querySelectorAll("script[src]").forEach((script) => {
            const link = document.createElement("link");
            link.rel = "preload";
            link.as = "script";
            link.href = script.getAttribute("src");
            document.head.append(link);
          });
        } catch {
          // Without storage the data still loads after the first card.
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (() => {
        window.addEventListener(
          "error",
          (event) => {
            const failedResource = event.target;
            if (!(failedResource instanceof HTMLScriptElement)) return;
            if (!new URL(failedResource.src, window.location.href).pathname.endsWith("/app.js")) {
              return;
            }

            const studyArea = document.querySelector(".study-area");
            const appStatus = document.querySelector("#appStatus");
            const fatalBanner = document.querySelector("#fatalErrorBanner");
            studyArea?.setAttribute("aria-busy", "false");
            if (appStatus) appStatus.hidden = true;
            if (fatalBanner) {
              fatalBanner.hidden = false;
              fatalBanner.focus();
            }
          },
          true,
        );
        // A slow connection shows a loading note; a fast one never sees it
        // (app.js hides the status once it starts).
        window.setTimeout(() => {
          const studyArea = document.querySelector(".study-area");
          const appStatus = document.querySelector("#appStatus");
          if (studyArea?.getAttribute("aria-busy") !== "true" || !appStatus) return;
          appStatus.textContent = "正在加载…";
          appStatus.hidden = false;
        }, 800);
      })();
    </script>
  </head>
  <body>
    <main class="app-shell">
      <h1 class="sr-only" id="appTitle">AyayaJp</h1>
      <noscript>
        <div class="noscript-banner" role="alert">
          此应用需要 JavaScript 才能运行。请启用 JavaScript 后刷新页面。
        </div>

      <section class="study-area" aria-labelledby="appTitle" aria-busy="true">

                  <span class="undo-text">撤回</span>
                </button>
                <p class="sr-only">

                  <span id="reviewedCount">0</span>
                </p>
              </section>

              <div
                class="app-status"
                id="appStatus"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                hidden
              ></div>
              <div
                class="load-error-banner"
                id="loadErrorBanner"
                role="alert"
                aria-live="assertive"
                aria-atomic="true"
                tabindex="-1"
                hidden
              ></div>
              <div
                class="fatal-error-banner"
                id="fatalErrorBanner"
                role="alert"
                aria-live="assertive"
                aria-atomic="true"
                tabindex="-1"
                hidden
              >
                应用未能启动。请刷新页面；如果问题持续，请确认所有本地资源都能正常加载。
              </div>
            </div>

            <div class="card" id="flashcard">
              <button
                class="card-reveal"
                id="cardReveal"
                type="button"
                aria-controls="answerPanel"
                aria-describedby="cardPrompt cardSubtle cardRevealHint"
                aria-expanded="false"
              >
                <span class="card-type" id="cardType"></span>
                <span class="card-pattern" id="cardPattern" hidden></span>
                <span class="card-prompt" id="cardPrompt"></span>
                <span class="sr-only" id="cardRevealHint">按下以显示答案</span>
              </button>
              <div class="card-phonetic">
                <span class="card-subtle" id="cardSubtle"></span>
                <button class="icon-button speaker-button prompt-speak" id="speakWord" type="button" title="播放读音" aria-label="播放读音"></button>
              </div>
              <div
                class="speech-status"
                id="speechStatus"
                role="status"
                aria-live="polite"
                hidden
              ></div>
            </div>
          </div>

          <div class="answer-panel" id="answerPanel" aria-hidden="true">
            <div class="choice-block" id="choiceBlock" hidden>
              <div class="choice-hint" id="choiceHint" hidden>
                <button class="text-button" id="choiceHintToggle" type="button" aria-keyshortcuts="h">提示</button>
                <div class="answer-meta choice-hint-body" id="choiceHintBody" hidden></div>
              </div>
              <div class="choice-list" id="choiceList"></div>
              <div class="choice-feedback" id="choiceFeedback" hidden></div>
            </div>
            <div class="answer-main" id="answerMain"></div>
            <div class="answer-details">

              <section class="answer-section example-block" id="exampleBlock" aria-labelledby="exampleTitle" hidden>

            </div>
            <div class="feedback-row" hidden>

              <button class="feedback unsure" type="button" data-rating="unsure" aria-keyshortcuts="2">模糊</button>

            <button class="primary-button choice-next" id="choiceNext" type="button" hidden>下一题</button>
          </div>
          <p class="reveal-hint" id="revealHint" aria-hidden="true" hidden>点击屏幕显示答案</p>

        <div class="empty-state" id="emptyState" hidden>
